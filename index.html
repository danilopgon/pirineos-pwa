<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pirineos sin bus · 5 días desde Benasque</title>
    <meta name="description" content="Guía offline de 5 días de senderismo con base en Benasque, solo coche." />
    <meta name="theme-color" content="#101d1a" />
    <script>
      try {
        const theme = localStorage.getItem('pirineos:tema:v1')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.querySelector('meta[name="theme-color"]').content = dark ? '#09100e' : '#101d1a'
      } catch {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pirineos" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" href="./icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
